# Families of apps that are installed through one launcher. Apps whose cask matches
# cask_patterns, or whose bundle id starts with one of bundle_prefixes, are dropped from the
# inventory and replaced by the target cask (listed under "consolidated" in inventory.json).
consolidate:
  jetbrains-toolbox:
    cask_patterns:
      - '^jetbrains-(?!toolbox$)'
      - '^intellij-idea'
      - '^pycharm'
      - '^webstorm'
      - '^goland'
      - '^clion'
      - '^rider$'
      - '^datagrip'
      - '^dataspell'
      - '^phpstorm'
      - '^rubymine'
      - '^rustrover'
      - '^aqua$'
      - '^android-studio'   # also installable through Toolbox
    bundle_prefixes:
      - 'com.jetbrains.'
      - 'com.google.android.studio'

# Rules used by scripts/categorize.py to sort an inventory into role presets when no LLM
# or assistant grouping is supplied. Edit freely: add tokens under casks/brews, or regexes
# under patterns (matched against the formula/cask name, tap prefix removed).
# mas_patterns are matched against Mac App Store app names.
presets:
  # `shared: true` presets are merged into every other preset, so each preset is
  # self-contained when deployed on its own (and still listed separately as `common`).
  common:
    description: Tools every Mac gets, whatever its role
    shared: true
    casks:
      - claude
      - claude-code
      - figma

  developer:

# Offline fallback recommendations, used by scripts/recommend.py when no web research,
# --source list, or LLM is available. This is a SMALL curated starter set, not a
# substitute for current online lists, and package names change over time. recommend.py
# checks every name against `brew formulae` / `brew casks` and drops any that no
# longer exist, so a stale entry is skipped rather than breaking an install.
#
# tier: 1 = very useful, 2 = nice to have, 3 = could be useful
# categories: roles from references/categories.yaml this entry is relevant to

